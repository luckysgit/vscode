<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .node-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; text-anchor: middle; }
      .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #475569; text-anchor: middle; }
      .line { stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow { fill: #64748b; }
      .card-shadow { filter: drop-shadow(0 4px 6px -1px rgba(0, 0, 0, 0.07)) drop-shadow(0 2px 4px -2px rgba(0, 0, 0, 0.05)); }
    </style>

    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1.5 L 6 4 L 0 6.5 z" class="arrow" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="620" fill="#f8fafc" rx="16" />

  <!-- Connecting Lines -->
  <!-- Level 1 (THREAT) to Level 2 (ACTOR, INTENT, CAPABILITY) -->
  <path d="M 480 90 L 480 135 M 190 135 L 770 135" class="line" />
  <path d="M 190 135 L 190 162" class="line" marker-end="url(#arrowhead)" />
  <path d="M 480 135 L 480 162" class="line" marker-end="url(#arrowhead)" />
  <path d="M 770 135 L 770 162" class="line" marker-end="url(#arrowhead)" />

  <!-- Level 2 (ACTOR) to Level 3 (Individual, Group, Network) -->
  <path d="M 190 230 L 190 280 M 80 280 L 300 280" class="line" />
  <path d="M 80 280 L 80 307" class="line" marker-end="url(#arrowhead)" />
  <path d="M 190 280 L 190 307" class="line" marker-end="url(#arrowhead)" />
  <path d="M 300 280 L 300 307" class="line" marker-end="url(#arrowhead)" />

  <!-- Level 3 (Network) to Level 4 (SUPPORT SYSTEM) -->
  <path d="M 300 365 L 300 407" class="line" marker-end="url(#arrowhead)" />

  <!-- Level 4 (SUPPORT SYSTEM) to Level 5 (Personnel, Logistics, Technology) -->
  <path d="M 300 465 L 300 505 M 150 505 L 450 505" class="line" />
  <path d="M 150 505 L 150 527" class="line" marker-end="url(#arrowhead)" />
  <path d="M 300 505 L 300 527" class="line" marker-end="url(#arrowhead)" />
  <path d="M 450 505 L 450 527" class="line" marker-end="url(#arrowhead)" />

  <!-- Nodes -->

  <!-- Top Root: THREAT -->
  <g class="card-shadow">
    <rect x="390" y="30" width="180" height="60" rx="12" fill="#ef4444" stroke="#dc2626" stroke-width="1.5" />
    <text x="480" y="67" class="title-text" font-size="20" fill="#ffffff" letter-spacing="1.5">THREAT</text>
  </g>

  <!-- Level 2: Core Pillars -->
  <!-- ACTOR -->
  <g class="card-shadow">
    <rect x="100" y="170" width="180" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="190" y="196" class="node-title">ACTOR</text>
    <text x="190" y="216" class="node-sub">("Who?")</text>
  </g>

  <!-- INTENT -->
  <g class="card-shadow">
    <rect x="375" y="170" width="210" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="480" y="196" class="node-title">INTENT</text>
    <text x="480" y="216" class="node-sub">("What do they want?")</text>
  </g>

  <!-- CAPABILITY -->
  <g class="card-shadow">
    <rect x="670" y="170" width="200" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="770" y="196" class="node-title">CAPABILITY</text>
    <text x="770" y="216" class="node-sub">("Can they do it?")</text>
  </g>

  <!-- Level 3: Actor Types -->
  <!-- Individual -->
  <g class="card-shadow">
    <rect x="30" y="315" width="100" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="80" y="346" class="node-title" font-size="14">Individual</text>
  </g>

  <!-- Group -->
  <g class="card-shadow">
    <rect x="145" y="315" width="90" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="190" y="346" class="node-title" font-size="14">Group</text>
  </g>

  <!-- Network -->
  <g class="card-shadow">
    <rect x="250" y="315" width="100" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="300" y="346" class="node-title" font-size="14" fill="#1d4ed8">Network</text>
  </g>

  <!-- Level 4: Support System -->
  <g class="card-shadow">
    <rect x="200" y="415" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <text x="300" y="446" class="node-title" font-size="14" fill="#334155" letter-spacing="0.5">SUPPORT SYSTEM</text>
  </g>

  <!-- Level 5: Support Branches -->
  <!-- Personnel -->
  <g class="card-shadow">
    <rect x="80" y="535" width="140" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="150" y="560" class="node-title" font-size="14">Personnel</text>
    <text x="150" y="578" class="node-sub" font-size="12">(Recruitment)</text>
  </g>

  <!-- Logistics -->
  <g class="card-shadow">
    <rect x="235" y="535" width="130" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="300" y="560" class="node-title" font-size="14">Logistics</text>
    <text x="300" y="578" class="node-sub" font-size="12">(Travel)</text>
  </g>

  <!-- Technology -->
  <g class="card-shadow">
    <rect x="380" y="535" width="140" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="450" y="560" class="node-title" font-size="14">Technology</text>
    <text x="450" y="578" class="node-sub" font-size="12">(Comms/Infra)</text>
  </g>
</svg>
